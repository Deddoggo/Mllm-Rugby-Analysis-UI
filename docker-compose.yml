services:

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DATA_MODE: api
    ports:
      - "3000:3000"
    depends_on:
      - backend


  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_URL: http://ai-service:9000
    volumes:
      - ./data:/app/data
    depends_on:
      - ai-service


  ai-service:
    build:
      context: ./ai-service
    ports:
      - "9000:9000"
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: "9000"
      RUGBY_DATA_DIR: /app/data
      EVENT_DETECTOR_PROVIDER: mock
      VLM_PROVIDER: qwen
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_MODEL: qwen3.7-flash
      QWEN_BASE_URL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    volumes:
      - ./data:/app/data
